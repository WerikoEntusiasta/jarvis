<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S. — Verificação Facial</title>
<style>
  html, body { margin: 0; height: 100%; background: #01091d; overflow: hidden;
    font-family: 'Segoe UI', sans-serif; color: #e2f3ff; }
  #wrap { position: relative; width: 100%; height: 100%; }
  video { width: 100%; height: 100%; object-fit: cover; opacity: .92; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .ring { position: absolute; top: 50%; left: 50%; width: 230px; height: 280px;
    transform: translate(-50%, -50%); border: 2px solid rgba(0,240,255,.75);
    border-radius: 46% 46% 48% 48% / 40% 40% 56% 56%; box-shadow: 0 0 32px rgba(0,240,255,.5); }
  .scanline { position: absolute; left: 0; right: 0; height: 2px; background: rgba(0,240,255,.65);
    box-shadow: 0 0 14px rgba(0,240,255,.9); animation: scan 2.1s linear infinite; }
  @keyframes scan { 0% { top: 18%; } 50% { top: 82%; } 100% { top: 18%; } }
  #status { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center;
    font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #7dd3fc;
    text-shadow: 0 0 10px rgba(0,240,255,.6); }
  #camera-off { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; font-size: 14px; color: #fbbf24; padding: 20px; }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay muted playsinline></video>
  <div class="overlay">
    <div class="ring"></div>
    <div class="scanline"></div>
  </div>
  <div id="status">inicializando câmera…</div>
  <div id="camera-off">Não foi possível acessar a câmera.<br>Verifique se ela não está em uso por outro app.</div>
</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="/models/face-api/face-api.js"></script>
<script>
const $ = id => document.getElementById(id);
let bridge = null;
let lastSentAt = 0;
let stableCount = 0;
let currentStream = null;
let detecting = false;
let modelsReady = false;

function status(t) { $('status').textContent = t; }

function initChannel() {
  return new Promise((resolve) => {
    if (typeof QWebChannel === 'undefined') { resolve(null); return; }
    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.bridge || null;
      resolve(bridge);
    });
  });
}

async function startCamera(deviceId) {
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  const video = $('video');
  const constraints = {
    video: deviceId ? { deviceId: { exact: deviceId }, width: 640, height: 480 } : { width: 640, height: 480 },
    audio: false
  };
  try {
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (e) {
    $('camera-off').style.display = 'flex';
    status('câmera indisponível');
    if (bridge && bridge.on_status) bridge.on_status('erro_camera');
    return;
  }
  $('camera-off').style.display = 'none';
  video.srcObject = currentStream;
  await video.play().catch(() => {});
  status('posicione o rosto no círculo — verificando…');
  if (bridge && bridge.on_status) bridge.on_status('detectando');
  if (!detecting) { detecting = true; loop(); }
  listCameras();
}
window.startCamera = startCamera;

async function listCameras() {
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    const cams = devs.filter(d => d.kind === 'videoinput')
      .map((d, i) => ({ deviceId: d.deviceId, label: d.label || ('Câmera ' + (i + 1)) }));
    if (bridge && bridge.on_cameras) bridge.on_cameras(JSON.stringify(cams));
  } catch (e) {}
}
window.listCameras = listCameras;

function loop() {
  const video = $('video');
  const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.45 });
  setInterval(async () => {
    if (!video.srcObject || !modelsReady) return;
    try {
      const result = await faceapi.detectSingleFace(video, opts)
        .withFaceLandmarks()
        .withFaceDescriptor();
      if (!result) { stableCount = 0; return; }
      stableCount++;
      if (stableCount >= 3) {
        const now = Date.now();
        if (now - lastSentAt > 4000) {
          lastSentAt = now;
          status('rosto detectado — validando no núcleo…');
          if (bridge && bridge.on_descriptor) bridge.on_descriptor(JSON.stringify(Array.from(result.descriptor)));
        }
      }
    } catch (e) { /* segue tentando */ }
  }, 700);
}

async function start() {
  await initChannel();

  // 1) CÂMERA PRIMEIRO: concede permissão -> enumerateDevices devolve deviceIds reais
  //    (assim o seletor de webcam funciona mesmo se os modelos demorarem/falharem)
  status('iniciando câmera…');
  await startCamera(null);

  // 2) MODELOS: força backend CPU (WebGL pode estar indisponível no WebEngine)
  status('carregando modelos neurais…');
  try {
    if (faceapi.tf) {
      try {
        await faceapi.tf.setBackend('cpu');
        await faceapi.tf.ready();
      } catch (be) {
        try { await faceapi.tf.setBackend('webgl'); await faceapi.tf.ready(); } catch (_) {}
      }
    }
    const URL = '/models/face-api';
    await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(URL);
    modelsReady = true;
    status('posicione o rosto no círculo — verificando…');
    if (bridge && bridge.on_status) bridge.on_status('detectando');
  } catch (e) {
    const msg = (e && (e.message || e.toString())) || 'erro desconhecido';
    status('falha ao carregar modelos: ' + msg);
    if (bridge && bridge.on_status) bridge.on_status('erro_modelos: ' + msg);
  }
}

start();
</script>
</body>
</html>
