<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S. // Desktop Holographic Canvas & Charts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: radial-gradient(circle at 50% 15%, #0b1326 0%, #050813 70%, #020408 100%);
    color: #e2f1ff;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(0, 240, 255, 0.3);
    box-shadow: inset 0 0 50px rgba(0, 240, 255, 0.08);
  }

  /* Header Stark HUD */
  .header {
    height: 52px;
    background: rgba(8, 14, 28, 0.9);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(0, 240, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 100;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .arc-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #00f0ff;
    box-shadow: 0 0 12px #00f0ff, 0 0 24px #00f0ff;
    animation: pulse 2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  .title-text {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #00f0ff;
    text-transform: uppercase;
  }
  .nav-tabs {
    display: flex;
    gap: 8px;
  }
  .tab-btn {
    background: rgba(0, 240, 255, 0.06);
    border: 1px solid rgba(0, 240, 255, 0.18);
    color: #8ab4f8;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
  }
  .tab-btn:hover {
    background: rgba(0, 240, 255, 0.2);
    color: #fff;
    border-color: #00f0ff;
  }
  .tab-btn.active {
    background: rgba(0, 240, 255, 0.28);
    color: #fff;
    border-color: #00f0ff;
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
  }

  /* Grid Layout */
  .canvas-stage {
    flex: 1;
    position: relative;
    width: 100%;
    height: calc(100vh - 52px);
    display: flex;
  }

  /* Canvas area */
  .canvas-box {
    flex: 1;
    position: relative;
    height: 100%;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Sidebar Stats Panel */
  .sidebar {
    width: 290px;
    background: rgba(6, 11, 22, 0.85);
    border-left: 1px solid rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(16px);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 50;
    overflow-y: auto;
  }
  .card {
    background: rgba(10, 18, 36, 0.7);
    border: 1px solid rgba(0, 240, 255, 0.15);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #6495ed;
    text-transform: uppercase;
  }
  .card-val {
    font-size: 24px;
    font-weight: 800;
    color: #00f0ff;
    font-family: monospace;
  }
  .card-sub {
    font-size: 11px;
    color: #9cb3d0;
  }
  .bar-container {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #00f0ff, #00ff88);
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Bottom Actions Deck */
  .bottom-bar {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    background: rgba(8, 15, 30, 0.88);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 30px;
    padding: 6px 16px;
    backdrop-filter: blur(14px);
    z-index: 60;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }
  .action-btn {
    background: transparent;
    border: 1px solid rgba(0, 240, 255, 0.25);
    color: #00f0ff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .action-btn:hover {
    background: #00f0ff;
    color: #050811;
    box-shadow: 0 0 14px #00f0ff;
  }
</style>
</head>
<body>

<div class="header">
  <div class="title-group">
    <div class="arc-dot"></div>
    <div class="title-text">J.A.R.V.I.S. // Desktop Canvas & Telemetria</div>
  </div>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchMode('charts')">📊 Gráficos de Hardware</button>
    <button class="tab-btn" onclick="switchMode('waves')">🌊 Espectro & Ondas</button>
    <button class="tab-btn" onclick="switchMode('reactor')">⚡ Reator Stark</button>
    <button class="tab-btn" onclick="switchMode('radar')">🎯 Radar Cibernético</button>
  </div>
</div>

<div class="canvas-stage">
  <div class="canvas-box">
    <canvas id="mainCanvas"></canvas>
    
    <div class="bottom-bar">
      <button class="action-btn" onclick="triggerAction('media_play_pause')">⏯ Play/Pause</button>
      <button class="action-btn" onclick="triggerAction('volume_up')">🔊 Vol +10%</button>
      <button class="action-btn" onclick="triggerAction('volume_down')">🔉 Vol -10%</button>
      <button class="action-btn" onclick="triggerAction('minimize_all')">🖥 Minimizar</button>
      <button class="action-btn" onclick="triggerAction('screenshot')">📸 Screenshot</button>
    </div>
  </div>

  <div class="sidebar">
    <div class="card">
      <div class="card-title">NVIDIA GTX 1660 Ti (CUDA)</div>
      <div class="card-val" id="gpuTemp">-- °C</div>
      <div class="card-sub" id="gpuVram">VRAM: -- / 6144 MB</div>
      <div class="bar-container">
        <div class="bar-fill" id="gpuBar" style="width: 35%;"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Processador (CPU Total)</div>
      <div class="card-val" id="cpuLoad">-- %</div>
      <div class="card-sub" id="cpuCores">Núcleos Físicos & Threads</div>
      <div class="bar-container">
        <div class="bar-fill" id="cpuBar" style="width: 25%; background: linear-gradient(90deg, #38bdf8, #818cf8);"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Memória RAM do Sistema</div>
      <div class="card-val" id="ramLoad">-- GB</div>
      <div class="card-sub" id="ramPct">--% em utilização ativa</div>
      <div class="bar-container">
        <div class="bar-fill" id="ramBar" style="width: 50%; background: linear-gradient(90deg, #f59e0b, #ef4444);"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Economia Local (Zero Cloud)</div>
      <div class="card-val" style="color:#00ff88;">100% OFFLINE</div>
      <div class="card-sub">Whisper CUDA + Visão Edge Local</div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');
  let currentMode = 'charts';
  let width, height;

  // Histórico de pontos para os gráficos
  const maxHistory = 80;
  const gpuHistory = new Array(maxHistory).fill(30);
  const cpuHistory = new Array(maxHistory).fill(20);
  const vramHistory = new Array(maxHistory).fill(40);
  let timeVal = 0;

  function resize() {
    const parent = canvas.parentElement;
    width = canvas.width = parent.clientWidth;
    height = canvas.height = parent.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
  }

  function triggerAction(actionName) {
    fetch('https://jarvis.werikspace.xyz/api/bridge/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: actionName })
    }).catch(e => console.log('Action dispatch:', e));
  }

  // Polling de telemetria de hardware real da máquina
  function fetchTelemetry() {
    fetch('https://jarvis.werikspace.xyz/api/hardware')
      .then(r => r.json())
      .then(d => {
        const cpu = d.cpu_percent || 15;
        const ram = d.ram_used_gb || 8;
        const ramPct = d.ram_percent || 50;
        const gpu = d.gpu || {};
        const gpuT = gpu.temperature || 42;
        const vramUsed = gpu.vram_used_mb || 1800;
        const vramTotal = gpu.vram_total_mb || 6144;
        const vramPct = Math.round((vramUsed / vramTotal) * 100);

        document.getElementById('gpuTemp').textContent = `${gpuT} °C`;
        document.getElementById('gpuVram').textContent = `VRAM: ${vramUsed} / ${vramTotal} MB (${vramPct}%)`;
        document.getElementById('gpuBar').style.width = `${vramPct}%`;

        document.getElementById('cpuLoad').textContent = `${cpu}%`;
        document.getElementById('cpuBar').style.width = `${cpu}%`;

        document.getElementById('ramLoad').textContent = `${ram} GB`;
        document.getElementById('ramPct').textContent = `${ramPct}% em utilização`;
        document.getElementById('ramBar').style.width = `${ramPct}%`;

        // Adiciona aos históricos
        gpuHistory.push(gpuT); if (gpuHistory.length > maxHistory) gpuHistory.shift();
        cpuHistory.push(cpu); if (cpuHistory.length > maxHistory) cpuHistory.shift();
        vramHistory.push(vramPct); if (vramHistory.length > maxHistory) vramHistory.shift();
      })
      .catch(() => {
        // Fallback simulado suave se API falhar
        const mockCpu = 20 + Math.sin(timeVal * 2) * 12 + Math.random() * 5;
        const mockGpu = 45 + Math.cos(timeVal) * 5;
        const mockVram = 35 + Math.sin(timeVal * 1.5) * 8;
        cpuHistory.push(mockCpu); if (cpuHistory.length > maxHistory) cpuHistory.shift();
        gpuHistory.push(mockGpu); if (gpuHistory.length > maxHistory) gpuHistory.shift();
        vramHistory.push(mockVram); if (vramHistory.length > maxHistory) vramHistory.shift();
      });
  }
  setInterval(fetchTelemetry, 1000);

  // Render Loop 60 FPS
  function loop() {
    timeVal += 0.03;
    ctx.clearRect(0, 0, width, height);

    if (currentMode === 'charts') {
      renderTelemetryCharts();
    } else if (currentMode === 'waves') {
      renderSpectrumWaves();
    } else if (currentMode === 'reactor') {
      renderArcReactor();
    } else if (currentMode === 'radar') {
      renderRadar();
    }

    requestAnimationFrame(loop);
  }

  // 1. GRÁFICO REALTIME DE HARDWARE (AREA CHARTS MULTICAMADA NEON)
  function renderTelemetryCharts() {
    const padX = 60;
    const padY = 50;
    const chartW = width - padX * 2;
    const chartH = height - padY * 2 - 40;

    // Grade holográfica de fundo
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
    ctx.lineWidth = 1;
    const rows = 6;
    for (let i = 0; i <= rows; i++) {
      const y = padY + (chartH / rows) * i;
      ctx.beginPath(); ctx.moveTo(padX, y); ctx.lineTo(padX + chartW, y); ctx.stroke();
      ctx.fillStyle = 'rgba(100, 150, 220, 0.5)';
      ctx.font = '10px monospace';
      const pctLabel = 100 - Math.round((100 / rows) * i);
      ctx.fillText(`${pctLabel}%`, padX - 35, y + 3);
    }
    const cols = 10;
    for (let j = 0; j <= cols; j++) {
      const x = padX + (chartW / cols) * j;
      ctx.beginPath(); ctx.moveTo(x, padY); ctx.lineTo(x, padY + chartH); ctx.stroke();
    }

    // Título do Gráfico
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 13px monospace';
    ctx.fillText('LIVE HARDWARE TELEMETRY // GPU GTX 1660 Ti & CPU CORES', padX, padY - 20);

    // Legendas
    ctx.fillStyle = '#00f0ff'; ctx.fillRect(padX + 460, padY - 28, 12, 12);
    ctx.fillStyle = '#e2f1ff'; ctx.font = '11px sans-serif'; ctx.fillText('VRAM GPU (%)', padX + 480, padY - 18);

    ctx.fillStyle = '#38bdf8'; ctx.fillRect(padX + 580, padY - 28, 12, 12);
    ctx.fillStyle = '#e2f1ff'; ctx.fillText('CPU Load (%)', padX + 600, padY - 18);

    ctx.fillStyle = '#f59e0b'; ctx.fillRect(padX + 700, padY - 28, 12, 12);
    ctx.fillStyle = '#e2f1ff'; ctx.fillText('Temp GPU (°C)', padX + 720, padY - 18);

    // Desenha Curva 1: VRAM Load (Ciano Fluorescente)
    drawSmoothSpline(vramHistory, padX, padY, chartW, chartH, 100, '#00f0ff', 'rgba(0, 240, 255, 0.18)');

    // Desenha Curva 2: CPU Load (Azul Celeste)
    drawSmoothSpline(cpuHistory, padX, padY, chartW, chartH, 100, '#38bdf8', 'rgba(56, 189, 248, 0.12)');

    // Desenha Curva 3: GPU Temp (Dourado Neon)
    drawSmoothSpline(gpuHistory, padX, padY, chartW, chartH, 100, '#f59e0b', 'rgba(245, 158, 11, 0.1)');
  }

  function drawSmoothSpline(data, px, py, pw, ph, maxVal, strokeColor, fillColor) {
    if (data.length < 2) return;
    const stepX = pw / (data.length - 1);

    ctx.beginPath();
    ctx.moveTo(px, py + ph - (data[0] / maxVal) * ph);

    for (let i = 0; i < data.length - 1; i++) {
      const x0 = px + i * stepX;
      const y0 = py + ph - (data[i] / maxVal) * ph;
      const x1 = px + (i + 1) * stepX;
      const y1 = py + ph - (data[i + 1] / maxVal) * ph;
      const cx = (x0 + x1) / 2;
      ctx.quadraticCurveTo(x0, y0, cx, (y0 + y1) / 2);
    }
    const lastX = px + (data.length - 1) * stepX;
    const lastY = py + ph - (data[data.length - 1] / maxVal) * ph;
    ctx.lineTo(lastX, lastY);

    // Linha de contorno neon
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = strokeColor;
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Área preenchida sob a curva
    ctx.lineTo(lastX, py + ph);
    ctx.lineTo(px, py + ph);
    ctx.closePath();
    ctx.fillStyle = fillColor;
    ctx.fill();

    // Ponto mais recente pulsante na ponta
    ctx.beginPath();
    ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // 2. ESPECTRO DE ÁUDIO & ONDAS FOURIER
  function renderSpectrumWaves() {
    const cx = width / 2;
    const cy = height / 2;
    const bars = 64;
    const step = width / bars;

    ctx.fillStyle = 'rgba(0, 240, 255, 0.05)';
    ctx.font = '14px monospace';
    ctx.fillText('FOURIER HARMONIC SPECTRUM // 60 FPS AUDIO FFT SYNTHESIZER', 40, 40);

    for (let i = 0; i < bars; i++) {
      const freq = Math.sin(timeVal * 3 + i * 0.15) * Math.cos(timeVal * 1.5 + i * 0.08);
      const barH = Math.max(8, Math.abs(freq) * (height * 0.5) + Math.sin(i * 0.4 + timeVal) * 30);
      const x = i * step + 4;
      const y = cy - barH / 2;

      const grad = ctx.createLinearGradient(x, y, x, y + barH);
      grad.addColorStop(0, '#00f0ff');
      grad.addColorStop(0.5, '#3b82f6');
      grad.addColorStop(1, '#a855f7');

      ctx.fillStyle = grad;
      ctx.fillRect(x, y, step - 6, barH);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y - 4, step - 6, 2);
    }
  }

  // 3. ARC REACTOR STARK HOLOGRAPHIC CANVAS
  function renderArcReactor() {
    const cx = width / 2;
    const cy = height / 2;

    const rings = [
      { r: 80, w: 2, c: 'rgba(0, 240, 255, 0.8)', speed: timeVal },
      { r: 130, w: 1.5, c: 'rgba(0, 240, 255, 0.5)', speed: -timeVal * 0.7 },
      { r: 180, w: 3, c: 'rgba(245, 158, 11, 0.8)', speed: timeVal * 0.5 },
      { r: 230, w: 1, c: 'rgba(0, 240, 255, 0.3)', speed: -timeVal * 0.3 }
    ];

    rings.forEach((ring, idx) => {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(ring.speed);
      ctx.beginPath();
      ctx.arc(0, 0, ring.r, 0, Math.PI * 2);
      ctx.strokeStyle = ring.c;
      ctx.lineWidth = ring.w;
      ctx.stroke();

      const segs = 16 + idx * 4;
      for (let i = 0; i < segs; i++) {
        const theta = (i / segs) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(theta) * (ring.r - 8), Math.sin(theta) * (ring.r - 8));
        ctx.lineTo(Math.cos(theta) * (ring.r + 8), Math.sin(theta) * (ring.r + 8));
        ctx.stroke();
      }
      ctx.restore();
    });

    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 70);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, '#00f0ff');
    grad.addColorStop(1, 'rgba(0, 240, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, 70, 0, Math.PI * 2);
    ctx.fill();
  }

  // 4. RADAR CIBERNÉTICO
  function renderRadar() {
    const cx = width / 2;
    const cy = height / 2;
    const maxR = Math.min(width, height) * 0.4;

    ctx.save();
    ctx.translate(cx, cy);

    ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
    ctx.lineWidth = 1;
    [maxR * 0.25, maxR * 0.5, maxR * 0.75, maxR].forEach(r => {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    });

    const sweep = timeVal * 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, maxR, sweep, sweep + 0.4);
    ctx.closePath();
    const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, maxR);
    grad.addColorStop(0, 'rgba(0, 240, 255, 0.7)');
    grad.addColorStop(1, 'rgba(0, 240, 255, 0)');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.restore();
  }

  loop();
</script>
</body>
</html>
