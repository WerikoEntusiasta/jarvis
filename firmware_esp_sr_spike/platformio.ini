[env:esp_sr_spike]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Mesmo alvo do firmware_jarvis_custom (leitura apenas, sem alterar o original)
board_upload.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESP_SR_SPIKE_MOCK=1

; NOTA: nenhum lib_deps de ESP-SR aqui de proposito.
; O ESP-SR v2.x exige IDF>=5.0; este env usa Arduino 2.0.17 + IDF 4.4.7
; (verificado em framework-arduinoespressif32/cores/esp32/esp_arduino_version.h
; e tools/sdk/esp32s3/include/esp_common/include/esp_idf_version.h).
; Adicionar o ESP-SR real aqui quebraria o build Arduino (componente CMake IDF,
; particao "model", movemodel.py). O probe abaixo detecta isso via __has_include.
