[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Configuracao de Flash DIO (verificada no hardware via RTS Reset)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.partitions = default_16MB.csv

build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Icomponents/esp-sr/include/esp32s3
    -Lcomponents/esp-sr/lib/esp32s3
    -lesp_audio_processor

extra_scripts = pre:patch_websockets_fingerprint.py

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4
    sh123/esp32_opus@^1.0.3
    esphome/esp-micro-speech-features@^1.2.0
    nickjgniklu/ESP_TF@^2.1.1


[env:custom_jarvis_esp32s3]
extends = env:esp32-s3-devkitc-1
