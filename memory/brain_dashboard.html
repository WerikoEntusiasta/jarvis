<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. - Cérebro Agêntico 3D & Central de Memória</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #020617;
      color: #e2e8f0;
      overflow: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
    
    .heroui-glass {
      background: linear-gradient(135deg, rgba(3, 10, 28, 0.85) 0%, rgba(1, 6, 20, 0.95) 100%);
      border: 1px solid rgba(0, 240, 255, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 240, 255, 0.15);
    }

    body.light-mode .heroui-glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(241, 245, 249, 0.95) 100%);
      border: 1px solid rgba(15, 23, 42, 0.15);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1), 0 0 25px rgba(15, 23, 42, 0.05);
      color: #0f172a;
    }

    body.light-mode .text-white { color: #0f172a !important; }
    body.light-mode .text-slate-400 { color: #475569 !important; }
    body.light-mode .text-slate-300 { color: #334155 !important; }
    
    .neon-border-cyan { border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
    .neon-text-cyan { color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(2, 6, 23, 0.8); }
    ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.3); border-radius: 9999px; }
  </style>
</head>
<body class="w-screen h-screen relative bg-slate-950 text-slate-100">

  <!-- 3D WebGL Canvas Container -->
  <div id="brain-3d-canvas" class="absolute inset-0 z-0 cursor-grab active:cursor-grabbing"></div>

  <!-- Header HUD Overlay -->
  <header class="absolute top-4 left-4 right-4 z-20 flex items-center justify-between pointer-events-none">
    <div class="flex items-center space-x-3 heroui-glass px-4 py-2.5 rounded-2xl pointer-events-auto">
      <div class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
      <div>
        <h1 class="text-sm font-extrabold text-white tracking-wider font-mono-code uppercase">CÉREBRO AGÊNTICO 3D</h1>
        <p class="text-[10px] text-cyan-400 font-mono-code">// MEMÓRIA CENTRALIZADA J.A.R.V.I.S.</p>
      </div>
    </div>

    <!-- Live Search & Controls -->
    <div class="flex items-center space-x-2 pointer-events-auto">
      <div class="relative w-64">
        <input type="text" id="search-input" placeholder="🔍 Pesquisar memórias..." class="w-full px-3.5 py-2 rounded-xl heroui-glass text-xs text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400 font-mono-code">
      </div>
      <button onclick="toggleImmersiveMode()" id="immersive-toggle-btn" class="px-3 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-600 text-slate-200 font-bold text-xs font-mono-code flex items-center gap-1.5 transition-all">
        <span>👁️</span> <span>Modo Foco</span>
      </button>
      <button onclick="toggleTheme()" id="theme-toggle-btn" class="px-3 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-600 text-slate-200 font-bold text-xs font-mono-code flex items-center gap-1.5 transition-all">
        <span id="theme-icon">☀️</span> <span id="theme-label">White Mode</span>
      </button>
      <button onclick="repositionAnatomicalBrain()" class="px-3.5 py-2 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 border border-sky-400/50 text-sky-300 font-bold text-xs font-mono-code flex items-center gap-1.5 transition-all shadow-[0_0_15px_rgba(56,189,248,0.25)]">
        <span>🧠</span> <span>Cérebro Anatômico Neon</span>
      </button>
      <button onclick="triggerSleepConsolidation()" class="px-3.5 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/50 text-amber-300 font-bold text-xs font-mono-code flex items-center gap-1.5 transition-all shadow-[0_0_15px_rgba(245,158,11,0.25)]">
        <span>🌙</span> <span>Ciclo de Sono</span>
      </button>
      <button onclick="syncMdFiles()" class="px-3.5 py-2 rounded-xl bg-purple-500/20 hover:bg-purple-500/30 border border-purple-400/50 text-purple-300 font-bold text-xs font-mono-code flex items-center gap-1.5 transition-all shadow-[0_0_15px_rgba(168,85,247,0.25)]">
        <span>🔄</span> <span>Sincronizar .MD</span>
      </button>
      <button onclick="openAddMemoryModal()" class="px-3.5 py-2 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-400/50 text-cyan-300 font-bold text-xs font-mono-code flex items-center gap-1.5 transition-all shadow-[0_0_15px_rgba(0,240,255,0.25)]">
        <span>+</span> <span>Nova Memória</span>
      </button>
    </div>
  </header>

  <!-- Floating Exit Immersive Mode Button -->
  <button id="exit-immersive-btn" onclick="toggleImmersiveMode()" class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-2xl bg-cyan-500/30 hover:bg-cyan-500/50 border border-cyan-400 text-cyan-200 font-bold text-xs font-mono-code hidden shadow-[0_0_20px_rgba(0,240,255,0.4)] backdrop-blur-md">
    <span>👁️</span> <span>Sair do Modo Foco (ESC)</span>
  </button>

  <!-- Left Sidebar Controls & .MD Files Menu -->
  <aside class="absolute top-20 left-4 z-20 w-80 max-h-[calc(100vh-6rem)] heroui-glass rounded-2xl p-4 flex flex-col space-y-3 pointer-events-auto shadow-2xl">
    <div class="pb-2 border-b border-cyan-500/20 flex items-center justify-between shrink-0">
      <span class="text-[10px] font-bold text-cyan-400 tracking-wider font-mono-code uppercase">STATUS DA MEMÓRIA</span>
      <span id="memory-count-badge" class="text-[9px] px-2 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-500/30 font-mono-code">0 NÓS</span>
    </div>

    <div class="space-y-1.5 shrink-0">
      <label class="text-[10px] uppercase font-bold text-slate-400 font-mono-code">Filtrar por Projeto:</label>
      <div class="flex flex-wrap gap-1.5" id="project-pills">
        <button onclick="filterByProject('ALL')" class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-cyan-500/30 text-cyan-200 border border-cyan-400/50">TODOS</button>
        <button onclick="filterByProject('JARVIS')" class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-slate-900 text-slate-400 hover:text-cyan-300 border border-slate-700">JARVIS</button>
        <button onclick="filterByProject('OpenClaw')" class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-slate-900 text-slate-400 hover:text-cyan-300 border border-slate-700">OpenClaw</button>
        <button onclick="filterByProject('Antigravity')" class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-slate-900 text-slate-400 hover:text-cyan-300 border border-slate-700">Antigravity</button>
      </div>
    </div>

    <!-- .MD Files Section -->
    <div class="pt-2 border-t border-cyan-500/20 flex-1 flex flex-col min-h-0 space-y-2">
      <div class="flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-1.5">
          <span class="text-xs">📂</span>
          <span class="text-[10px] font-bold text-cyan-400 tracking-wider font-mono-code uppercase">ARQUIVOS .MD / DOCS</span>
        </div>
        <span id="md-count-badge" class="text-[9px] px-2 py-0.5 rounded bg-sky-950 text-sky-300 border border-sky-500/30 font-mono-code">0 ARQUIVOS</span>
      </div>

      <input type="text" id="md-search-input" placeholder="🔍 Filtrar .md..." oninput="filterMdFileList(this.value)" class="w-full px-2.5 py-1.5 rounded-xl bg-slate-950/80 border border-cyan-500/30 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 font-mono-code shrink-0">

      <!-- Scrollable List of .MD files -->
      <div id="md-files-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1 min-h-[200px] max-h-[380px]">
        <!-- Populated dynamically -->
      </div>
    </div>
  </aside>

  <!-- Right Inspector Sidebar -->
  <aside id="inspector-panel" class="absolute top-20 right-4 z-20 w-80 heroui-glass rounded-2xl p-5 space-y-3 pointer-events-auto hidden animate-slide-up">
    <div class="pb-2 border-b border-cyan-500/20 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span id="inspect-type-icon" class="text-base">🧠</span>
        <span id="inspect-project" class="text-[10px] font-bold text-cyan-400 tracking-wider font-mono-code uppercase">PROJETO</span>
      </div>
      <button onclick="closeInspector()" class="text-slate-400 hover:text-white text-xs px-2 py-0.5 rounded bg-slate-900 border border-slate-700">✕</button>
    </div>

    <h3 id="inspect-title" class="text-sm font-bold text-white font-mono-code">Título da Memória</h3>
    
    <div class="p-3 rounded-xl bg-slate-950/80 border border-cyan-500/20 text-xs text-slate-300 leading-relaxed font-normal whitespace-pre-wrap max-h-60 overflow-y-auto" id="inspect-content">
      Conteúdo detalhado da memória...
    </div>

    <div class="text-[10px] text-slate-400 font-mono-code flex flex-wrap gap-1" id="inspect-tags">
      <span class="px-2 py-0.5 rounded bg-slate-900 border border-cyan-500/30 text-cyan-300">#jarvis</span>
    </div>

    <div class="pt-2 flex justify-between items-center border-t border-cyan-500/20">
      <span id="inspect-time" class="text-[9px] text-slate-500 font-mono-code">08/10/2026</span>
      <button id="inspect-delete-btn" onclick="deleteCurrentMemory()" class="px-2.5 py-1 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 border border-rose-400/50 text-rose-300 text-[10px] font-bold">Remover</button>
    </div>
  </aside>

  <!-- Add Memory Modal -->
  <div id="add-memory-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md hidden">
    <div class="heroui-glass p-6 rounded-2xl w-full max-w-md border border-cyan-400/50 space-y-4 font-mono-code">
      <div class="flex items-center justify-between pb-2 border-b border-cyan-500/20">
        <h3 class="text-xs font-bold text-white tracking-wider uppercase">NOVA MEMÓRIA AGÊNTICA</h3>
        <button onclick="closeAddMemoryModal()" class="text-slate-400 hover:text-white text-xs">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Projeto:</label>
          <input type="text" id="new-mem-project" value="JARVIS" class="w-full p-2.5 rounded-xl bg-slate-950 border border-cyan-500/30 text-white focus:outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Tipo:</label>
          <select id="new-mem-type" class="w-full p-2.5 rounded-xl bg-slate-950 border border-cyan-500/30 text-white focus:outline-none focus:border-cyan-400">
            <option value="project">Projeto / Módulo</option>
            <option value="code">Código / Infraestrutura</option>
            <option value="rule">Regra / Diretriz</option>
            <option value="entity">Entidade / Agente</option>
            <option value="conversation">Conversa / Contexto</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Título:</label>
          <input type="text" id="new-mem-title" placeholder="ex: Configuração de Banco de Dados" class="w-full p-2.5 rounded-xl bg-slate-950 border border-cyan-500/30 text-white focus:outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Conteúdo:</label>
          <textarea id="new-mem-content" rows="3" placeholder="Insira o conhecimento ou contexto a ser memorizado..." class="w-full p-2.5 rounded-xl bg-slate-950 border border-cyan-500/30 text-white focus:outline-none focus:border-cyan-400"></textarea>
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Tags (separadas por vírgula):</label>
          <input type="text" id="new-mem-tags" placeholder="jarvis, docker, memoria" class="w-full p-2.5 rounded-xl bg-slate-950 border border-cyan-500/30 text-white focus:outline-none focus:border-cyan-400">
        </div>
      </div>

      <div class="pt-2 flex justify-end space-x-2 border-t border-cyan-500/20">
        <button onclick="closeAddMemoryModal()" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 text-xs">Cancelar</button>
        <button onclick="submitNewMemory()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-sky-600 text-slate-950 font-bold text-xs">Gravar no Cérebro</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 3D NEURAL BRAIN THREE.JS ENGINE
    // =========================================================================
    let scene, camera, renderer, controls;
    let nodeGroups = [];
    let raycastTargets = [];
    let energyPulses = [];
    let particleCloud = null;
    let brainPlexusLines = null;
    let lineLines = null;
    let graphData = { nodes: [], links: [] };
    let selectedNode = null;
    let currentProjectFilter = 'ALL';
    let isWhiteTheme = false;

    const TYPE_COLORS = {
      project: 0x00f0ff,      // Cyan neon
      code: 0x10b981,         // Emerald
      rule: 0xf59e0b,         // Amber
      entity: 0xec4899,       // Magenta
      conversation: 0x8b5cf6, // Violet
      agent_md: 0x38bdf8      // Glowing Sky Blue
    };

    function createGlowSprite(colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.3, colorHex);
      gradient.addColorStop(0.7, colorHex.replace('1)', '0.2)').replace('rgb', 'rgba'));
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
      return new THREE.Sprite(material);
    }

    function init3DBrain() {
      const container = document.getElementById('brain-3d-canvas');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020617, 0.015);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 12, 35);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.7;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0x00f0ff, 2.5, 100);
      pointLight.position.set(10, 20, 20);
      scene.add(pointLight);

      // Initialize 3D Laser Selection Ring around selected nodes
      initSelectionRing();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isImmersive) toggleImmersiveMode();
      });
      renderer.domElement.addEventListener('click', onCanvasClick);

      fetchGraphData();
      animate();
    }

    let selectionRing = null;
    let isImmersive = false;

    function initSelectionRing() {
      const ringGeo = new THREE.RingGeometry(0.55, 0.72, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
      selectionRing = new THREE.Mesh(ringGeo, ringMat);
      selectionRing.visible = false;
      scene.add(selectionRing);
    }

    function toggleImmersiveMode() {
      isImmersive = !isImmersive;
      document.body.classList.toggle('immersive-mode', isImmersive);
      const exitBtn = document.getElementById('exit-immersive-btn');
      if (exitBtn) {
        if (isImmersive) exitBtn.classList.remove('hidden');
        else exitBtn.classList.add('hidden');
      }
    }

    function toggleTheme() {
      isWhiteTheme = !isWhiteTheme;
      document.body.classList.toggle('light-mode', isWhiteTheme);
      document.body.style.background = isWhiteTheme ? '#f8fafc' : '#020617';
      document.body.style.color = isWhiteTheme ? '#0f172a' : '#e2e8f0';

      if (scene) scene.fog.color.setHex(isWhiteTheme ? 0xf8fafc : 0x020617);
      if (selectionRing) selectionRing.material.color.setHex(isWhiteTheme ? 0x0f172a : 0x00f0ff);

      document.getElementById('theme-icon').innerText = isWhiteTheme ? '🌙' : '☀️';
      document.getElementById('theme-label').innerText = isWhiteTheme ? 'HUD Escuro' : 'White Mode';
    }

    async function repositionAnatomicalBrain() {
      try {
        const res = await fetch('/api/memory/reposition', { method: 'POST' });
        const data = await res.json();
        alert('Memórias reposicionadas na silhueta anatômica do cérebro!');
        fetchGraphData();
      } catch (err) {
        alert('Erro ao reposicionar memórias: ' + err);
      }
    }

    async function triggerSleepConsolidation() {
      try {
        const res = await fetch('/api/memory/sleep_consolidation', { method: 'POST' });
        const data = await res.json();
        alert(`Ciclo de sono concluído!\nNós consolidados: ${data.nodes_consolidated || 0}\nSynapses podadas: ${data.synapses_pruned || 0}`);
        fetchGraphData();
      } catch (err) {
        alert('Erro no ciclo de sono: ' + err);
      }
    }

    async function syncMdFiles() {
      try {
        const res = await fetch('/api/memory/reposition', { method: 'POST' });
        alert('Arquivos .MD e diretrizes de agentes sincronizados com o Cérebro 3D!');
        fetchGraphData();
      } catch (err) {
        alert('Erro ao sincronizar arquivos .MD: ' + err);
      }
    }

    async function fetchGraphData() {
      try {
        const res = await fetch('/api/memory/graph');
        graphData = await res.json();
        renderBrainGraph();
      } catch (err) {
        console.error('[Brain3D Error]', err);
      }
    }

    function renderBrainGraph() {
      // Clear existing node groups and lines
      nodeGroups.forEach(g => scene.remove(g));
      nodeGroups = [];
      raycastTargets = [];
      energyPulses.forEach(p => scene.remove(p.mesh));
      energyPulses = [];
      if (lineLines) scene.remove(lineLines);

      const nodes = graphData.nodes.filter(n => currentProjectFilter === 'ALL' || n.project === currentProjectFilter);
      document.getElementById('memory-count-badge').innerText = `${nodes.length} NÓS`;
      populateMdFileList(nodes);

      // Sleek Micro-Synaptic Node Geometries (No giant globes!)
      const coreGeo = new THREE.SphereGeometry(0.12, 10, 10);
      const wireGeo = new THREE.IcosahedronGeometry(0.22, 1);
      const ringGeo = new THREE.TorusGeometry(0.35, 0.015, 6, 16);

      nodes.forEach(node => {
        const group = new THREE.Group();
        const hexColor = TYPE_COLORS[node.type] || 0x00f0ff;
        const colorObj = new THREE.Color(hexColor);
        const rgbStr = `rgb(${Math.floor(colorObj.r*255)}, ${Math.floor(colorObj.g*255)}, ${Math.floor(colorObj.b*255)})`;

        // 1. Inner Radiant White Micro-Core
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        group.add(coreMesh);

        // 2. Outer Micro Wireframe Shell
        const wireMat = new THREE.MeshBasicMaterial({
          color: hexColor,
          wireframe: true,
          transparent: true,
          opacity: 0.65
        });
        const wireMesh = new THREE.Mesh(wireGeo, wireMat);
        group.add(wireMesh);

        // 3. Subtle Glowing Aura Halo (Subtle 0.7 scale instead of giant 2.4 blob)
        const glowSprite = createGlowSprite(rgbStr);
        glowSprite.scale.set(0.7, 0.7, 1);
        group.add(glowSprite);

        // 4. Delicate Orbital Ring for key project / agent_md nodes
        if (node.type === 'project' || node.type === 'agent_md' || node.importance >= 4) {
          const ringMat = new THREE.MeshBasicMaterial({ color: hexColor, transparent: true, opacity: 0.75 });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.rotation.x = Math.PI / 3;
          group.add(ringMesh);
        }

        // Invisible Bounding Target for easy click detection
        const targetGeo = new THREE.SphereGeometry(0.45, 8, 8);
        const targetMat = new THREE.MeshBasicMaterial({ visible: false });
        const targetMesh = new THREE.Mesh(targetGeo, targetMat);
        targetMesh.userData = node;
        group.add(targetMesh);
        raycastTargets.push(targetMesh);

        group.position.set(node.x || 0, node.y || 0, node.z || 0);
        group.userData = { node, wireMesh, glowSprite, initialY: node.y || 0 };
        scene.add(group);
        nodeGroups.push(group);
      });

      // Render Synaptic Energy Lines & Pulses
      const linePositions = [];
      const lineColors = [];
      const nodeMap = new Map(nodes.map(n => [n.id, n]));

      graphData.links.forEach(link => {
        const source = nodeMap.get(link.source);
        const target = nodeMap.get(link.target);
        if (source && target) {
          linePositions.push(source.x, source.y, source.z);
          linePositions.push(target.x, target.y, target.z);

          const c1 = new THREE.Color(TYPE_COLORS[source.type] || 0x00f0ff);
          const c2 = new THREE.Color(TYPE_COLORS[target.type] || 0x00f0ff);
          lineColors.push(c1.r, c1.g, c1.b);
          lineColors.push(c2.r, c2.g, c2.b);

          // Flowing Synaptic Energy Pulse Particle
          if (Math.random() < 0.6) {
            const pGeo = new THREE.SphereGeometry(0.06, 6, 6);
            const pMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            const pMesh = new THREE.Mesh(pGeo, pMat);
            scene.add(pMesh);
            energyPulses.push({
              mesh: pMesh,
              start: new THREE.Vector3(source.x, source.y, source.z),
              end: new THREE.Vector3(target.x, target.y, target.z),
              progress: Math.random(),
              speed: 0.005 + Math.random() * 0.008
            });
          }
        }
      });

      if (linePositions.length > 0) {
        const lineGeo = new THREE.BufferGeometry();
        lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        lineGeo.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));

        const lineMat = new THREE.LineBasicMaterial({
          vertexColors: true,
          transparent: true,
          opacity: 0.18,
          blending: THREE.AdditiveBlending
        });

        lineLines = new THREE.LineSegments(lineGeo, lineMat);
        scene.add(lineLines);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      const time = Date.now() * 0.002;

      if (selectionRing && selectionRing.visible) {
        selectionRing.rotation.z += 0.025;
      }

      // Pulse and rotate node Groups
      nodeGroups.forEach((group, idx) => {
        const wireMesh = group.userData.wireMesh;
        if (wireMesh) {
          wireMesh.rotation.x += 0.01;
          wireMesh.rotation.y += 0.015;
        }
        const pulseScale = 1 + Math.sin(time * 2 + idx) * 0.1;
        group.scale.set(pulseScale, pulseScale, pulseScale);
      });

      // Animate Synaptic Energy Pulses moving along lines
      energyPulses.forEach(p => {
        p.progress += p.speed;
        if (p.progress > 1) p.progress = 0;
        p.mesh.position.lerpVectors(p.start, p.end, p.progress);
      });

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function populateMdFileList(nodes) {
      const mdListEl = document.getElementById('md-files-list');
      const countBadge = document.getElementById('md-count-badge');
      if (!mdListEl) return;

      const mdNodes = (nodes || graphData.nodes).filter(n => n.type === 'agent_md' || (n.title && (n.title.includes('📄') || n.title.toLowerCase().includes('.md'))) || (n.tags && n.tags.includes('markdown')));
      if (countBadge) countBadge.innerText = `${mdNodes.length} ARQUIVOS`;

      if (mdNodes.length === 0) {
        mdListEl.innerHTML = `<div class="text-[10px] text-slate-500 italic p-3 font-mono-code text-center">Nenhum arquivo .md encontrado</div>`;
        return;
      }

      mdListEl.innerHTML = mdNodes.map(n => {
        const cleanTitle = n.title.replace('📄', '').trim();
        const proj = n.project || 'JARVIS';
        return `
          <div onclick="focusOnNodeById('${n.id}')" class="p-2 rounded-xl bg-slate-900/90 hover:bg-cyan-950/80 border border-cyan-500/20 hover:border-cyan-400/60 cursor-pointer transition-all flex items-center justify-between group shadow-sm">
            <div class="flex items-center space-x-2 truncate">
              <span class="text-xs group-hover:scale-125 transition-transform shrink-0">📄</span>
              <span class="text-xs text-slate-200 group-hover:text-cyan-300 font-mono-code truncate max-w-[155px]" title="${cleanTitle}">${cleanTitle}</span>
            </div>
            <span class="text-[8px] px-1.5 py-0.5 rounded bg-slate-950 group-hover:bg-cyan-900 text-cyan-400 font-mono-code uppercase shrink-0 border border-cyan-500/30">${proj}</span>
          </div>
        `;
      }).join('');
    }

    function filterMdFileList(query) {
      const q = query.toLowerCase().trim();
      const allMd = graphData.nodes.filter(n => n.type === 'agent_md' || (n.title && (n.title.includes('📄') || n.title.toLowerCase().includes('.md'))) || (n.tags && n.tags.includes('markdown')));
      const filtered = allMd.filter(n => !q || n.title.toLowerCase().includes(q) || (n.content && n.content.toLowerCase().includes(q)) || (n.tags && n.tags.toLowerCase().includes(q)));
      populateMdFileList(filtered);
    }

    function focusOnNodeById(nodeId) {
      const node = graphData.nodes.find(n => n.id === nodeId);
      if (node) focusOnNode(node);
    }

    function focusOnNode(node) {
      if (!node) return;
      openInspector(node);
      
      const targetPos = new THREE.Vector3(node.x || 0, node.y || 0, node.z || 0);

      if (selectionRing) {
        selectionRing.position.copy(targetPos);
        selectionRing.lookAt(camera.position);
        selectionRing.visible = true;
      }

      const offset = new THREE.Vector3(0, 1.5, 12);
      const startTime = Date.now();
      const startCamera = camera.position.clone();
      const startTarget = controls.target.clone();
      const endCamera = targetPos.clone().add(offset);
      const endTarget = targetPos.clone();
      
      function animFocus() {
        const elapsed = (Date.now() - startTime) / 500;
        if (elapsed < 1) {
          camera.position.lerpVectors(startCamera, endCamera, elapsed);
          controls.target.lerpVectors(startTarget, endTarget, elapsed);
          if (selectionRing) selectionRing.lookAt(camera.position);
          controls.update();
          requestAnimationFrame(animFocus);
        } else {
          camera.position.copy(endCamera);
          controls.target.copy(endTarget);
          if (selectionRing) selectionRing.lookAt(camera.position);
          controls.update();
        }
      }
      animFocus();
    }

    function onCanvasClick(event) {
      const mouse = new THREE.Vector2(
        (event.clientX / window.innerWidth) * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
      );

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(raycastTargets);
      if (intersects.length > 0) {
        const hitNode = intersects[0].object.userData;
        focusOnNode(hitNode);
      }
    }

    function openInspector(node) {
      selectedNode = node;
      const panel = document.getElementById('inspector-panel');
      document.getElementById('inspect-project').innerText = node.project || 'GERAL';
      document.getElementById('inspect-title').innerText = node.title;
      document.getElementById('inspect-content').innerText = node.content;
      document.getElementById('inspect-tags').innerHTML = (node.tags || '').split(',')
        .map(t => `<span class="px-2 py-0.5 rounded bg-slate-900 border border-cyan-500/30 text-cyan-300">#${t.trim()}</span>`).join('');
      
      panel.classList.remove('hidden');
    }

    function closeInspector() {
      document.getElementById('inspector-panel').classList.add('hidden');
      selectedNode = null;
    }

    async function deleteCurrentMemory() {
      if (!selectedNode) return;
      if (confirm(`Remover memória "${selectedNode.title}"?`)) {
        await fetch(`/api/memory/${selectedNode.id}`, { method: 'DELETE' });
        closeInspector();
        fetchGraphData();
      }
    }

    function filterByProject(project) {
      currentProjectFilter = project;
      renderBrainGraph();
    }

    // Modal controls
    function openAddMemoryModal() { document.getElementById('add-memory-modal').classList.remove('hidden'); }
    function closeAddMemoryModal() { document.getElementById('add-memory-modal').classList.add('hidden'); }

    async function submitNewMemory() {
      const proj = document.getElementById('new-mem-project').value.trim() || 'JARVIS';
      const type = document.getElementById('new-mem-type').value;
      const title = document.getElementById('new-mem-title').value.trim();
      const content = document.getElementById('new-mem-content').value.trim();
      const tags = document.getElementById('new-mem-tags').value.trim();

      if (!title || !content) { alert('Preencha título e conteúdo!'); return; }

      await fetch('/api/memory/remember', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project: proj, type, title, content, tags })
      });

      closeAddMemoryModal();
      fetchGraphData();
    }

    // Real-time Search Filter
    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      nodeGroups.forEach(group => {
        const node = group.userData.node;
        if (!node) return;
        const match = !q || (node.title && node.title.toLowerCase().includes(q)) || (node.content && node.content.toLowerCase().includes(q)) || (node.tags && node.tags.toLowerCase().includes(q));
        group.visible = match;
      });
    });

    window.onload = init3DBrain;
  </script>
</body>
